<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Wrriter - Creative Writing App</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      // Mock window.wrriter interface if running inside standard web browser context
      if (!window.wrriter) {
        window.wrriter = {
          selectVault: async () => ({ success: true, path: '/mock/vault' }),
          getVaultStatus: async () => ({ isLoaded: true, path: '/mock/vault' }),
          getVaultIndex: async () => ({
            notes: [],
            tagMap: {},
            drawings: [],
            reminders: []
          }),
          getSettings: async () => ({ theme: 'dark' }),
          setSettings: async (settings) => console.log('Mock setSettings:', settings),
          getHotkeys: async () => ({
            commandPalette: 'Ctrl+Shift+Space',
            floatingWindow: 'Ctrl+Shift+W'
          }),
          setHotkeys: async (hotkeys) => console.log('Mock setHotkeys:', hotkeys),
          getSyncthingStatus: async () => ({
            status: 'synced',
            connectedDevices: 2,
            deviceName: 'Web Browser Mock',
            version: 'v1.23.4'
          }),
          getSyncthingConfig: async () => ({
            url: 'http://localhost:8384',
            apiKey: 'mock_api_key_12345',
            folderId: 'default'
          }),
          setSyncthingConfig: async (config) => console.log('Mock setSyncthingConfig:', config),
          onVaultChange: (callback) => {
            console.log('Mock onVaultChange registered');
            return () => {};
          },
          onNavigateNote: (callback) => {
            console.log('Mock onNavigateNote registered');
            return () => {};
          },
          onIndexUpdate: (callback) => {
            console.log('Mock onIndexUpdate registered');
            return () => {};
          },
          getLibraries: async () => [],
          saveLibraries: async (items) => console.log('Mock saveLibraries:', items)
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
